<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
<link href="css/style.css?v=3" rel="stylesheet"/>
</head>
<body class="auth-page preloader-active">

<!-- Preloader -->
<div id="preloader">
    <div class="ring-preloader-v2">
        <div class="progress-ring-container">
            <svg class="progress-ring" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <circle class="progress-ring__background" stroke="#e2e8f0" stroke-width="5" fill="transparent" r="45" cx="50" cy="50"/>
                <circle class="progress-ring__circle" stroke="var(--primary)" stroke-width="5" fill="transparent" r="45" cx="50" cy="50"/>
            </svg>
            <div class="progress-text-v2"><span id="progress-percent">0</span>%</div>
        </div>
        <img src="logo-blue.webp" alt="Stackly Logo" class="preloader-logo-v2">
    </div>
    <script>
        (function(){
            let pct = document.getElementById('progress-percent');
            let start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let val = Math.min(Math.floor((progress / 1200) * 100), 100);
                if (pct) pct.innerText = val;
                if (progress < 1200) {
                    window.requestAnimationFrame(step);
                }
            }
            window.requestAnimationFrame(step);
        })();
    </script>
</div>

<div style="position: absolute; top: 20px; left: 20px;">
    <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem; border-color: var(--border); background: white;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>
<div class="auth-card" data-aos="zoom-in">
<div class="auth-header">
<a class="logo" href="index.html" style="justify-content:center;"><img alt="Logo" src="logo-blue.webp" class="responsive-logo"/></a>
<h2 style="margin-top:0.5rem; margin-bottom:0.25rem; font-size:1.5rem;">Welcome Back</h2>
<p style="color:var(--text-light); margin:0;">Sign in to securely manage your finances</p>
</div>
<form data-success-action="login_success" id="proLoginForm" novalidate="novalidate">
<div class="form-group">
<label class="form-label" for="loginEmail">Email Address</label>
<input class="form-control" id="loginEmail" autocomplete="email" data-custom-required="true" placeholder="name@company.com" type="email"/>
</div>
<div class="form-group">
<label class="form-label" for="loginPassword">Password</label>
<div style="position:relative;">
<input class="form-control" id="loginPassword" autocomplete="current-password" type="password" placeholder="Enter password" data-custom-required="true" />
<i class="fa-solid fa-eye" id="togglePassword" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text-light);"></i>
</div>
</div>
<div class="form-group">
<label class="form-label" for="loginRole">Select Role</label>
<select class="form-control" id="loginRole" data-custom-required="true">
<option value="client">Client Portal</option>
<option value="admin">Admin Dashboard</option>
</select>
</div>
<div style="display:flex; flex-direction:column; gap:0.25rem; align-items:center; margin-bottom:1rem; font-size:0.85rem; width:100%; text-align:center;">
<label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; color:var(--text-main);">
<input id="dynamicField_login_1" style="width:16px; height:16px; accent-color:var(--accent);" type="checkbox"/> Remember me
                </label>
<a href="404.html" onclick="window.location.href='404.html'; return false;" style="font-weight:600; color:var(--accent);">Forgot Password?</a>
</div>
<button class="btn btn-primary btn-block" id="loginSubmitBtn" style="justify-content:center; padding:0.6rem 1rem;" type="submit">Sign In</button>
</form>
<p style="text-align:center; margin-top:1rem; font-size:0.95rem; color:var(--text-light);">
            Don't have an account? <a href="signup.html" style="font-weight:700; color:var(--primary);">Sign Up</a>
</p>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js"></script>
<script>document.getElementById('togglePassword').addEventListener('click', function() { const pw = document.getElementById('loginPassword'); const type = pw.getAttribute('type') === 'password' ? 'text' : 'password'; pw.setAttribute('type', type); this.classList.toggle('fa-eye-slash'); });</script></body>
</html>
