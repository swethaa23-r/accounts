<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="auth-page">
<div class="auth-card" data-aos="zoom-in" style="max-width: 550px;">
<div class="auth-header">
<a class="logo" href="index.html" style="justify-content:center;"><img alt="Logo" src="logo-blue.webp" class="responsive-logo"/></a>
<h2 style="margin-top:0.5rem; margin-bottom:0.25rem; font-size:1.5rem;">Create an Account</h2>
<p style="color:var(--text-light); margin:0;">Join us to gain absolute financial clarity.</p>
</div>
<!-- Success Message Block -->
<div id="signupSuccess" style="display:none; padding:1.25rem; background:rgba(16,185,129,0.1); color:#059669; border-radius:var(--radius); margin-bottom:1.5rem; border:1px solid rgba(16,185,129,0.3); text-align:center;">
<i class="fa-solid fa-circle-check" style="font-size:1.5rem; margin-bottom:0.5rem;"></i>
<h4 style="margin:0; font-size:1.1rem;">Account Created!</h4>
<p style="margin:0; font-size:0.95rem;">Redirecting to login...</p>
</div>
<form id="proSignupForm" novalidate="novalidate">
<div class="form-group">
<label class="form-label" for="sName">Full Name</label>
<input class="form-control" id="sName" autocomplete="name" data-custom-required="true" placeholder="John Doe" type="text"/>
</div>
<div class="form-group">
<label class="form-label" for="sEmail">Email ID</label>
<input class="form-control" id="sEmail" autocomplete="email" data-custom-required="true" placeholder="john@example.com" type="email"/>
</div>
<div class="form-group">
<label class="form-label" for="sRole">Select Role</label>
<select class="form-control" id="sRole" data-custom-required="true">
<option value="client">Client</option>
<option value="admin">Admin</option>
</select>
</div>
<div class="grid-form-2">
<div class="form-group">
<label class="form-label" for="sPassword">Password</label>
<div style="position:relative;">
<input class="form-control" id="sPassword" autocomplete="new-password" type="password" placeholder="Enter password" data-custom-required="true" />
<i class="fa-solid fa-eye" id="toggleSPassword" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text-light);" onclick="const pw = document.getElementById('sPassword'); pw.type = pw.type === 'password' ? 'text' : 'password'; this.classList.toggle('fa-eye-slash');"></i>
</div>
</div>
<div class="form-group">
<label class="form-label" for="sConfirmPassword">Confirm Password</label>
<div style="position:relative;">
<input class="form-control" id="sConfirmPassword" autocomplete="new-password" type="password" placeholder="Confirm password" data-custom-required="true" />
<i class="fa-solid fa-eye" id="toggleSConfirmPassword" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text-light);" onclick="const pw = document.getElementById('sConfirmPassword'); pw.type = pw.type === 'password' ? 'text' : 'password'; this.classList.toggle('fa-eye-slash');"></i>
</div>
</div>
</div>
<p style="font-size:0.85rem; color:var(--text-light); margin-bottom:1.5rem;">By signing up, you agree to our <a href="404.html" onclick="window.location.href='404.html'; return false;" style="color:var(--accent); font-weight:600;">Terms of Service</a> and <a href="404.html" onclick="window.location.href='404.html'; return false;" style="color:var(--accent); font-weight:600;">Privacy Policy</a>.</p>
<button class="btn btn-primary btn-block" id="signupSubmitBtn" style="justify-content:center; padding:0.6rem 1rem;" type="submit">Create Account</button>
</form>
<p style="text-align:center; margin-top:1rem; font-size:0.95rem; color:var(--text-light);">
            Already have an account? <a href="login.html" style="font-weight:700; color:var(--primary);">Login</a>
</p>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
